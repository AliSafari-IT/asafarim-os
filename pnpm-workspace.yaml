packages:
  # Shared libraries (manifest contract, SDK, config presets).
  - "packages/*"
  # Core services (gateway generator, core-api, identity, admin). Never import an app.
  - "core/*"
  # Built-in apps, each a self-describing plugin.
  - "apps/*"
  # Developer tooling (the `platform` CLI).
  - "tools/*"
allowBuilds:
  # tsx/vitest native binary (same as asafarim-platform)
  esbuild: true
minimumReleaseAgeExclude:
  # Our own package (AliSafari-IT/progress-bars), taken the day it was published: 0.7.3 is the
  # release that drops the Google Fonts @imports Flow's generate bar waited for (#288). Its dist
  # was checked: no external URLs, imports only react. Drop this entry once 0.7.3 is a day old.
  - "@asafarim/progress-bars@0.7.3"
overrides:
  # Security (pnpm audit, asafarim-platform#817): patched versions of transitive
  # dependencies whose parents haven't released a fix yet. Drop an entry once
  # its parent ships the fix on its own.
  # next / vite -> postcss -> source-map-js: high, event-loop DoS through
  # crafted source maps (GHSA-68fv-2mgg-jv7q, fixed in 1.2.2).
  "source-map-js@>=1.0.0 <1.2.2": ^1.2.2
  # docs (#80) -> mermaid -> chevrotain -> lodash-es: high, code injection through
  # `_.template` (and a moderate prototype pollution), fixed in 4.18.1.
  "lodash-es@>=4.0.0 <4.18.1": ^4.18.1
  # docs (#80) -> mermaid -> katex: low, prototype pollution bypassing trust
  # restrictions (GHSA-238p-pmpm-9mq7), fixed in 0.18.2.
  "katex@>=0.11.0 <0.18.2": 0.18.9

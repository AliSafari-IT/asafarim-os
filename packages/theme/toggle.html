<button
  type="button"
  class="os-theme-toggle"
  data-theme-toggle
  data-testid="theme-toggle"
  aria-label="Dark theme"
  aria-pressed="false"
  title="Light or dark theme"
>
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <mask id="os-theme-moon">
      <rect width="24" height="24" fill="#fff" />
      <circle class="os-theme-bite" cx="17.5" cy="6.5" r="6" fill="#000" />
    </mask>
    <circle class="os-theme-core" cx="12" cy="12" r="5" fill="currentColor" mask="url(#os-theme-moon)" />
    <path
      class="os-theme-rays"
      d="M12 1.5v2.5M12 20v2.5M1.5 12h2.5M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />
  </svg>
</button>

# Build and publish the identity image (asafarim-os#44, P2.3 step 2).
#
# core/identity/compose.snippet.yml pulls ghcr.io/alisafari-it/asafarim-os:identity-<tag>. This workflow is
# what puts that image there. It builds core/identity/Dockerfile from the repository root, as the identity
# README says (`docker build -f core/identity/Dockerfile .`).
#
# - push to main: build and push two tags. `identity-<full commit sha>` is immutable, and deploys use it.
#   `identity-main` moves with every build and is for convenience only.
# - pull request: build only, to catch Dockerfile errors. Nothing is pushed and nothing logs in to the registry.
# - workflow_dispatch: pushes only when run on main. On any other branch it builds without pushing, so a branch
#   can never move `identity-main`.
#
# The registry login uses the built-in GITHUB_TOKEN. No secrets are added to the repository.
name: Identity image

on:
  push:
    branches: [main]
    paths:
      - "core/identity/**"
      - "packages/**"
      # The Dockerfile installs with --frozen-lockfile, so the dependency graph is part of the image.
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/identity-image.yml"
  pull_request:
    paths:
      - "core/identity/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/identity-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: identity-image-${{ github.ref }}
  # A newer PR push replaces the stale PR build. A publish on main is never cancelled half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/alisafari-it/asafarim-os

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # packages: write is for this job only (publishing to GHCR). Nothing else gets it.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The Dockerfile does `COPY . .` and there is no .dockerignore: keep the token out of .git.
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/identity/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          provenance: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:identity-${{ github.sha }}
            ${{ env.IMAGE }}:identity-main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Published \`${IMAGE}:identity-${GITHUB_SHA}\` (also \`identity-main\`)."
            echo "Digest: \`${DIGEST}\`"
            echo "On the VPS: \`docker pull ${IMAGE}:identity-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

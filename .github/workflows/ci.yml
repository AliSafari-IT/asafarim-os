name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Redis and Postgres for core/identity's integration tests (they flush the Redis DBs
    # they use, and create and drop their own database).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IDENTITY_TEST_REDIS_URL: redis://localhost:6379/15
      IDENTITY_TEST_DATABASE_URL: postgres://postgres:postgres-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Brand spelling (ASafariM, #778)
        run: pnpm check:brand

      - name: No plaintext secrets in git (envage)
        run: pnpm env:check

      - name: Dev script tests (the dev dependency build covers every app, #34)
        run: pnpm test:scripts

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # #78: the docs app reads documents at runtime only. Build it (standalone, as its image will be)
      # and fail if any fixture's marker text is in .next/. apps/docs/Dockerfile runs it on the image's build too (#83).
      - name: No document content in the docs app build
        run: pnpm --filter @asafarim/docs check:no-content

      - name: The core never imports an app
        run: pnpm platform:boundaries

      - name: Generated platform files are up to date
        run: pnpm platform:sync:check

      # P7.2 (ADR 0001 §10): what each manifest declares vs what its code does. Advisory: it prints
      # findings and only fails on an unreadable or invalid manifest.
      - name: Manifest review (advisory)
        run: pnpm platform manifest review

  # P7.2 part 2b (ADR 0001 §10 item 2): the same review, posted on the pull request as ONE comment
  # that is updated in place (found by the report's hidden first-line marker). Advisory: the job may
  # fail without failing CI. A clean report with no earlier comment posts nothing. Runs on
  # `pull_request` only (never pull_request_target) with the default token; on a fork's PR that token
  # is read-only, so the post is skipped with a warning.
  manifest-review-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The report is printed even when a manifest can't be reviewed (exit 1); `checks` fails on that.
      - name: Manifest review as Markdown
        run: pnpm --silent platform manifest review --markdown > "$RUNNER_TEMP/review.md" || echo "::warning::manifest review exited $?"

      - name: Post or update the PR comment
        uses: actions/github-script@v9
        env:
          REVIEW_FILE: ${{ runner.temp }}/review.md
        with:
          script: |
            const fs = require("node:fs");
            const MARKER = "<!-- asafarim:manifest-review -->";
            const CLEAN = "<!-- asafarim:manifest-review:clean -->";
            const raw = fs.existsSync(process.env.REVIEW_FILE) ? fs.readFileSync(process.env.REVIEW_FILE, "utf8") : "";
            // Build tool output can come first on stdout: the report starts at its marker.
            const start = raw.indexOf(MARKER);
            if (start < 0) {
              core.warning("The manifest review printed no Markdown report; nothing to post.");
              return;
            }
            const body = raw.slice(start).trimEnd() + "\n";
            const clean = body.includes(CLEAN);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const mine = comments.find((c) => c.user?.login === "github-actions[bot]" && c.body?.includes(MARKER));
              if (mine) {
                if (mine.body === body) {
                  core.info(`Comment ${mine.id} is up to date.`);
                } else {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
                  core.info(`Updated comment ${mine.id}.`);
                }
              } else if (clean) {
                core.info("No findings and no earlier comment: nothing to post.");
              } else {
                const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
                core.info(`Created comment ${data.id}.`);
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning(`Can't comment on this pull request (read-only token, e.g. a fork): ${error.message}`);
              } else {
                core.warning(`Posting the manifest review failed: ${error.message}`);
              }
            }

  # The production deploy files (#45). No secrets and no Docker daemon of ours: Compose renders the
  # file, shellcheck reads the scripts, and the edge's pinned Caddy validates the site files. The
  # tests of these files run with the others, in `checks` (pnpm test:scripts).
  deploy-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The production compose file renders
        run: |
          # Empty stand-ins: Compose refuses a missing env_file, and the real ones are secret and git-ignored.
          : > .env.identity
          : > .env.docs
          # Every image tag is required (no default), also for a service whose profile is off.
          export IMAGE_TAG=ci SITE_IMAGE_TAG=ci DOCS_IMAGE_TAG=ci CORE_API_IMAGE_TAG=ci ADMIN_IMAGE_TAG=ci FLOW_IMAGE_TAG=ci
          docker compose -p asafarim-os -f deploy/compose.prod.yml config -q
          # And with the core profile (os-postgres, os-core-api), as a deploy with core-api's env runs it.
          : > .env.core-api
          COMPOSE_PROFILES=core docker compose -p asafarim-os -f deploy/compose.prod.yml config -q
          # And with the Admin console on top (os-admin, #175).
          : > .env.admin
          COMPOSE_PROFILES=core,admin docker compose -p asafarim-os -f deploy/compose.prod.yml config -q
          # And with Flow (os-flow, #258) and the event bus (os-nats, #259): every profile at once.
          : > .env.flow
          : > .env.nats
          COMPOSE_PROFILES=core,flow docker compose -p asafarim-os -f deploy/compose.prod.yml config -q
          COMPOSE_PROFILES=core,nats docker compose -p asafarim-os -f deploy/compose.prod.yml config -q
          COMPOSE_PROFILES=core,admin,flow,nats docker compose -p asafarim-os -f deploy/compose.prod.yml config -q

      - name: shellcheck the deploy scripts
        run: shellcheck -S warning deploy/vps-deploy.sh deploy/lib/env-check.sh deploy/lib/live-caddy.sh deploy/redeploy.sh deploy/test-fixtures/run-env-check.sh deploy/core-api/initdb/10-core.sh

      # The same pinned image the edge's own edge-deploy-site.sh validates with.
      - name: The site files validate in the edge's Caddy
        run: |
          for site in sites/asafarim-os.caddy sites/asafarim-os-site.caddy deploy/rollback.caddy; do
            dir="$(mktemp -d)"
            mkdir "$dir/sites"
            echo 'import sites/*.caddy' > "$dir/Caddyfile"
            cp "$site" "$dir/sites/asafarim-os.caddy"
            docker run --rm -v "$dir:/etc/caddy:ro" -w /etc/caddy caddy:2.11.4 \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

  # asafarim.site (#70): build the site and its image, run the image as the os-site container with the
  # production hardening (read-only root, no capabilities, a tmpfs /tmp, 32 MB), check the security headers,
  # and run the Playwright smoke test against it. (Lint, typecheck and the unit tests run in `checks`.)
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm --filter @asafarim/site build

      - name: Build the os-site image
        run: docker build -f core/site/Dockerfile -t asafarim-os-site:ci .

      - name: Run it as os-site runs in production
        run: |
          docker run -d --name os-site -p 127.0.0.1:8088:8080 \
            --read-only --tmpfs /tmp:size=4m --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 32m --cpus 0.25 -e NGINX_ENTRYPOINT_QUIET_LOGS=1 asafarim-os-site:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8088/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8088/healthz

      - name: The security headers
        run: |
          set -euo pipefail
          for path in / /styles.css /does-not-exist /schemas/app-manifest.schema.json; do
            headers="$(curl -sS -D - -o /dev/null "http://127.0.0.1:8088${path}")"
            echo "$headers"
            grep -qi '^strict-transport-security: max-age=' <<<"$headers"
            grep -qi '^x-content-type-options: nosniff' <<<"$headers"
            grep -qi "^content-security-policy: default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://id.asafarim.site;" <<<"$headers"
          done

      # #87: the served copy is the Zod schema's JSON Schema output, byte for byte. Regenerating it must
      # change nothing in git, and both served paths must equal that file.
      - name: The served manifest schema matches the Zod schema
        run: |
          set -euo pipefail
          pnpm --filter @asafarim/app-manifest schema
          git diff --exit-code packages/app-manifest/schema/
          for path in /schemas/app-manifest.schema.json /schemas/app-manifest/v1.json; do
            curl -fsS "http://127.0.0.1:8088${path}" | cmp - packages/app-manifest/schema/app-manifest.schema.json
          done

      - name: Install the browser
        run: pnpm --filter @asafarim/site exec playwright install --with-deps chromium

      - name: Smoke test against the container
        env:
          SITE_URL: http://127.0.0.1:8088
          SITE_EXPECT_HEADERS: "1"
        run: pnpm --filter @asafarim/site e2e

      - name: The container stays small
        if: always()
        run: docker stats --no-stream os-site; docker logs os-site 2>&1 | tail -20

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-smoke
          path: |
            core/site/test-results/
            core/site/playwright-report/
          if-no-files-found: ignore

  # OS-D1 (#26): the local dev environment end to end: compose up, the
  # per-service bootstrap twice (idempotent), identity and core-api /readyz
  # green, a full sign-in through the dev login stub to an ID token; then
  # core-api's integration tests (P3.1) on the same Postgres and NATS, and the
  # event bus tests (P4.1); then everything down.
  dev-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dev environment smoke test
        run: pnpm dev:smoke

      # P4.1 PR 4: the dev bus checks every client. The integration tests sign in as core-api's own
      # `core` user and, for the identity tests, sign JWTs with the callout issuer key: both are the
      # throwaway values `pnpm dev:keys` just generated in .dev/ (masked in the log anyway).
      - name: Dev bus credentials for the tests
        run: |
          for pair in "NATS_CORE_PASSWORD:.dev/nats.env" "CORE_API_NATS_ISSUER_SEED:.dev/core-api.env"; do
            key="${pair%%:*}"; file="${pair#*:}"
            value="$(grep "^${key}=" "$file" | cut -d= -f2-)"
            test -n "$value"
            echo "::add-mask::$value"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done

      # ADR 0001 §3 step 6: Remove backs up an app's database with pg_dump (the runner's Postgres
      # client, which must be at least the dev server's 16); retention.integration.test.ts runs it.
      - name: pg_dump for the Remove backup tests
        run: pg_dump --version

      # core-api (P3.1) against the dev Postgres and NATS the smoke test left running.
      - name: core-api integration tests
        env:
          CORE_API_TEST_ADMIN_URL: postgres://postgres:postgres-dev-only@127.0.0.1:55440/postgres
          CORE_API_TEST_NATS_URL: nats://127.0.0.1:54222
          CORE_API_TEST_REQUIRED: "1"
        run: pnpm turbo run test --filter=@asafarim/core-api

      # P4.1: the outbox, the relay and the notes reference flow against the same Postgres and NATS
      # JetStream. The bus-down test stops and starts that NATS container (its store survives), so
      # the two suites run one after the other (--concurrency=1), never while the other uses the bus.
      - name: Event bus integration tests
        env:
          EVENTS_TEST_ADMIN_URL: postgres://postgres:postgres-dev-only@127.0.0.1:55440/postgres
          EVENTS_TEST_NATS_URL: nats://127.0.0.1:54222
          EVENTS_TEST_NATS_CONTROL: compose
          EVENTS_TEST_REQUIRED: "1"
        run: pnpm turbo run test --concurrency=1 --filter=@asafarim/events --filter=@asafarim/notes

      - name: Tear down
        if: always()
        run: pnpm dev:reset --yes

  # P3.2 and P3.3a: the notes acceptance flows in a real browser against the real stack:
  # install → self-registration → sign in through identity and the dev login
  # stub → read-only (403 naming the permission) → grant → write → deactivate;
  # and the same app through the dev gateway (Caddy, notes.localhost:8080): the
  # unavailable page, 401/403 at the gateway, expose:false → 404, and a revoked
  # grant taking effect within the access token's lifetime; and the Admin console
  # (P3.3b, core.localhost:8080): a non-admin gets 403, an admin activates notes and
  # grants a role, the member's launcher shows it and then loses it, every action
  # audited, keyboard and light/dark checks; and the Docs reader (#80) on its
  # made-up fixtures: rendering, contents, search, the phone drawer and Lighthouse
  # accessibility (at least 95, light and dark, in test-results/lighthouse.json).
  # Screenshots and the Playwright report are uploaded either way.
  notes-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @asafarim/notes exec playwright install --with-deps chromium

      - name: Notes end-to-end
        run: pnpm e2e --down

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notes-e2e
          path: |
            apps/notes/test-results/
            apps/notes/playwright-report/
            core/admin/test-results/
            core/admin/playwright-report/
            apps/docs/test-results/
            apps/docs/playwright-report/
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Redis for core/identity's integration tests (flushed by them).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IDENTITY_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Brand spelling (ASafariM, #778)
        run: pnpm check:brand

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: The core never imports an app
        run: pnpm platform:boundaries

      - name: Generated platform files are up to date
        run: pnpm platform:sync:check

  # OS-D1 (#26): the local dev environment end to end: compose up, the
  # per-service bootstrap twice (idempotent), identity and core-api /readyz
  # green, a full sign-in through the dev login stub to an ID token; then
  # core-api's integration tests (P3.1) on the same Postgres; then everything down.
  dev-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dev environment smoke test
        run: pnpm dev:smoke

      # core-api (P3.1) against the dev Postgres the smoke test left running.
      - name: core-api integration tests
        env:
          CORE_API_TEST_ADMIN_URL: postgres://postgres:postgres-dev-only@127.0.0.1:55440/postgres
          CORE_API_TEST_REQUIRED: "1"
        run: pnpm turbo run test --filter=@asafarim/core-api

      - name: Tear down
        if: always()
        run: pnpm dev:reset --yes

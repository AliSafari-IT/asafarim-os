# Build and publish the core-api image (core-api in production, so apps can check permissions).
#
# deploy/compose.prod.yml pulls ghcr.io/alisafari-it/asafarim-os:core-api-<tag>. This workflow is
# what puts that image there. It builds core/core-api/Dockerfile from the repository root
# (`docker build -f core/core-api/Dockerfile .`).
#
# - push to main: build and push two tags. `core-api-<full commit sha>` is immutable, and deploys use it.
#   `core-api-main` moves with every build and is for convenience only.
# - pull request: build only, to catch Dockerfile errors. Nothing is pushed and nothing logs in to the registry.
# - workflow_dispatch: pushes only when run on main. On any other branch it builds without pushing, so a branch
#   can never move `core-api-main`.
#
# The registry login uses the built-in GITHUB_TOKEN. No secrets are added to the repository.
name: Core API image

on:
  push:
    branches: [main]
    paths:
      - "core/core-api/**"
      - "packages/**"
      # The Dockerfile installs with --frozen-lockfile, so the dependency graph is part of the image.
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/core-api-image.yml"
  pull_request:
    paths:
      - "core/core-api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/core-api-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # A newer push to a PR replaces that PR's stale build. On main every commit gets its OWN group: a group keeps
  # only one pending run and cancels the others, so a shared group would drop a commit's publish and that commit
  # would never get its core-api-<sha> tag.
  group: core-api-image-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/alisafari-it/asafarim-os

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # packages: write is for this job only (publishing to GHCR). Nothing else gets it.
    permissions:
      contents: read
      packages: write
    env:
      # Publish only from main, and never for a pull request.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The Dockerfile does `COPY . .` and there is no .dockerignore: keep the token out of .git.
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Decide what to publish. (a) The commit tag is immutable: a re-run must never replace it, because the
      # floating base image may have moved and the same sha would then name a different image. (b) core-api-main
      # only moves FORWARD: it is published only when this commit is still the head of main, so a re-run of an
      # older commit cannot point it back. If the head lookup fails we publish the new commit tag and leave
      # core-api-main alone; if the tag lookup fails for any reason other than "not found", the step fails.
      - name: Plan the tags
        id: plan
        if: env.PUBLISH == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha_tag="${IMAGE}:core-api-${SHA}"
          # Only "the registry says it is not there" means publish. Any other failure (auth, network, GHCR
          # outage) fails the step: guessing "missing" could replace a tag that exists.
          if inspect_out="$(docker buildx imagetools inspect "$sha_tag" 2>&1)"; then
            echo "::notice::${sha_tag} is already published: leaving it unchanged."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -Eiq 'not found|manifest unknown|name unknown' <<<"$inspect_out"; then
            echo "::error::Could not tell whether ${sha_tag} exists; not publishing. Output:"
            echo "$inspect_out"
            exit 1
          fi
          tags="$sha_tag"
          head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1 || true)"
          if [[ "$head" == "$SHA" ]]; then
            tags+=$'\n'"${IMAGE}:core-api-main"
          else
            echo "::notice::${SHA} is not the head of main (head: ${head:-unknown}): not moving core-api-main."
          fi
          {
            echo "publish=true"
            echo "tags<<TAGS"
            echo "$tags"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      # Before anything is published: build the image into the local Docker and run it the way production does
      # (read-only root, no capabilities, its own Postgres 16), then check it migrates, answers /readyz, and that
      # pg_dump (Remove's backups) is the server's major version. A broken image never gets a tag.
      - name: Build for the smoke test
        if: steps.plan.outputs.publish != 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: core/core-api/Dockerfile
          load: true
          push: false
          tags: asafarim-os-core-api:smoke

      - name: Smoke test (read-only, against Postgres 16)
        if: steps.plan.outputs.publish != 'false'
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-db --network smoke -e POSTGRES_PASSWORD=smoke-provisioner postgres:16-alpine
          # Over TCP: the image's first-start init runs a temporary server on the Unix socket only, then restarts it.
          # A socket check can pass on that temporary server and the next command hits the restart.
          for _ in $(seq 1 60); do docker exec smoke-db pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker exec smoke-db psql -U postgres -c "CREATE ROLE core_api LOGIN PASSWORD 'smoke-core'" -c "CREATE DATABASE core OWNER core_api"
          jwk="$(node -e 'const c=require("crypto");const j=c.generateKeyPairSync("ed25519").privateKey.export({format:"jwk"});j.kid="smoke";console.log(JSON.stringify(j))')"
          docker run -d --name smoke-api --network smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=16m --tmpfs /var/lib/core-api/backups:size=16m,uid=1000,gid=1000 \
            -e CORE_API_DATABASE_URL=postgres://core_api:smoke-core@smoke-db:5432/core \
            -e CORE_API_PROVISIONER_URL=postgres://postgres:smoke-provisioner@smoke-db:5432/postgres \
            -e CORE_API_ADMIN_TOKEN=smoke-admin-token-0123456789abcdef0123 \
            -e CORE_API_TOKEN_SIGNING_JWK="$jwk" \
            asafarim-os-core-api:smoke
          ok=false
          for _ in $(seq 1 30); do
            if docker exec smoke-api wget -qO- http://127.0.0.1:4020/readyz 2>/dev/null | grep -q '"database":true'; then ok=true; break; fi
            sleep 1
          done
          docker logs smoke-api
          [[ "$ok" == true ]] || { echo "::error::core-api did not become ready"; exit 1; }
          docker exec smoke-api sh -c 'pg_dump --version' | grep -q 'PostgreSQL) 16\.' \
            || { echo "::error::pg_dump in the image is not Postgres 16"; exit 1; }
          docker exec smoke-api sh -c 'id -u' | grep -qx 1000 || { echo "::error::core-api does not run as node (1000)"; exit 1; }
          echo "core-api image: migrated, ready, pg_dump 16, non-root, read-only root."

      # On a pull request the plan step is skipped: the image is built (to catch Dockerfile errors) and not pushed.
      - name: Build (and push, on main)
        id: build
        if: steps.plan.outputs.publish != 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: core/core-api/Dockerfile
          push: ${{ steps.plan.outputs.publish == 'true' }}
          provenance: ${{ steps.plan.outputs.publish == 'true' }}
          tags: ${{ steps.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        if: env.PUBLISH == 'true'
        env:
          PLANNED: ${{ steps.plan.outputs.publish }}
          TAGS: ${{ steps.plan.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ "$PLANNED" == "false" ]]; then
            echo "\`${IMAGE}:core-api-${GITHUB_SHA}\` was already published: left unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "Published:"
            while IFS= read -r tag; do echo "- \`${tag}\`"; done <<< "$TAGS"
            echo "Digest: \`${DIGEST}\`"
            echo "On the VPS: \`docker pull ${IMAGE}:core-api-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

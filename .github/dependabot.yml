version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A Dependabot PR is a PR: merged one at a time, on green CI. Keep the queue short.
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # No semver-major bumps from the bot, for any package. Toolchain majors
      # (TypeScript, ESLint + typescript-eslint, @types/node, Zod, Vitest) are a
      # deliberate, reviewed decision, made by hand.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

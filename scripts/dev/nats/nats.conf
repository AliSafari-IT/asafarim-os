# The dev/CI event bus (P4.1 PR 4, ADR 0001 §5). Never used in production: no TLS, no operator mode.
#
# Every client but `core` is sent to core-api (NATS auth callout): an app connects with user = its
# app id and password = a signed assertion made with its registry credential, and gets exactly the
# permissions its current manifest allows. Anonymous connects are refused.
#
# `core` is core-api's own privileged user (stream and consumer admin, and the callout responder).
# The two values come from .dev/nats.env (generated by `pnpm dev:keys`, git-ignored): NATS reads
# them from the environment, so no secret is in this file.
accounts {
  OS {
    jetstream: enabled
    users: [ { user: core, password: $NATS_CORE_PASSWORD } ]
  }
}

authorization {
  auth_callout {
    issuer: $NATS_AUTH_ISSUER
    account: OS
    auth_users: [ core ]
  }
}

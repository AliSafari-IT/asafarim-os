# Local development infrastructure for ASafariM OS (OS-D1, #26). Started by
# `pnpm dev`; never used in production. Every port binds to 127.0.0.1 only.
#
#   pnpm dev          start it, bootstrap the databases, run the OS
#   pnpm dev:reset    drop the dev volumes (asks first): Postgres, Redis and the NATS store
name: asafarim-os-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      # A fixed, dev-only password: this server only listens on 127.0.0.1.
      POSTGRES_PASSWORD: postgres-dev-only
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # P3.3a: the dev gateway. Caddy serves each app at http://<id>.localhost:8080 from the
  # config `platform sync` generates (generated/platform/gateway/), checking every request
  # with core-api (forward_auth). core-api, identity and the apps run on the host, so the
  # container reaches them as host.docker.internal; .dev/gateway.env holds their ports.
  # The config DIRECTORY is mounted, not one file (the asafarim-platform #733 lesson).
  gateway:
    image: caddy:2-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/dev.Caddyfile", "--adapter", "caddyfile"]
    env_file:
      - .dev/gateway.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./generated/platform/gateway:/etc/caddy:ro
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      # The catch-all site answers /gateway-health with 200 (generated by `platform sync`).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # P4.1: the event bus. NATS with JetStream, its file store on a dev volume. Apps publish through
  # their outbox relay; core-api creates each publishing app's stream (APP_<ID>) at install.
  # P4.1 PR 4: it checks every client. nats.conf sends all connects but core-api's own to core-api's
  # auth callout (an app signs in with its registry credential and gets only what its manifest
  # allows); the two values it needs are in .dev/nats.env (`pnpm dev:keys`). The config DIRECTORY is
  # mounted, not one file (the asafarim-platform #733 lesson).
  # 8222 is NATS's monitoring port, used only by the healthcheck inside the container.
  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats.conf", "-js", "-sd", "/data", "-m", "8222"]
    env_file:
      - .dev/nats.env
    ports:
      - "127.0.0.1:54222:4222"
    volumes:
      - nats_data:/data
      - ./scripts/dev/nats:/etc/nats:ro
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      # /healthz?js-enabled-only=true answers 200 once JetStream is up.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  redis_data:
  nats_data:

# ASafariM OS production stack: the identity service (id.asafarim.site) and its own Redis
# (asafarim-os#45, part of #22, P2.3), the asafarim.site landing page, os-site (#70), and docs.asafarim.site, os-docs
# (#83). Also breinhap.asafarim.site, breinhap-site (a landing page built in AliSafari-IT/breinhap), and
# igs.asafarim.site, igs-site (a landing page built in AliSafari-IT/igs-pharma). The owner deploys it with deploy/vps-deploy.sh; nothing else runs this file. See deploy/README.md for the
# deploy, the rollback and the network rules.
#
#   IMAGE_TAG=<sha> SITE_IMAGE_TAG=<sha> DOCS_IMAGE_TAG=<sha> CORE_API_IMAGE_TAG=<sha> ADMIN_IMAGE_TAG=<sha> docker compose -p asafarim-os -f deploy/compose.prod.yml config -q
#
# Paths here are relative to THIS file (deploy/), not to the repository root.
name: asafarim-os

services:
  identity:
    # Published by .github/workflows/identity-image.yml (#44). IMAGE_TAG is the full commit sha of the
    # build to run; there is no default, so a deploy without one fails instead of pulling a wrong tag.
    image: ghcr.io/alisafari-it/asafarim-os:identity-${IMAGE_TAG:?set IMAGE_TAG to the identity image's commit sha}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    # Decrypted from core/identity/.env.production.age by deploy/vps-deploy.sh, at the repository root.
    env_file:
      - ../.env.identity
    environment:
      IDENTITY_ISSUER: https://id.asafarim.site
      IDENTITY_HUB_CONTINUE_URL: https://hub.asafarim.com/oidc/continue
      IDENTITY_CLIENTS_FILE: /etc/identity/clients.json
      # Linked in an identity admin's header (local sign-in). The console still checks core.admin itself.
      IDENTITY_ADMIN_CONSOLE_URL: https://admin.asafarim.site/
      # Logical DB 3 is reserved for the identity service (oidc: keys only). This stack's OWN Redis:
      # it never uses asafarim-com's (stacks share nothing but the edge).
      IDENTITY_REDIS_URL: redis://os-redis:6379/3
    volumes:
      # The client config is the owner's, put there at deploy time (the dark launch's test client).
      # It is not in git: see deploy/README.md. vps-deploy.sh refuses to start without it, because
      # Docker would otherwise create a directory at that path.
      - ./identity/clients.json:/etc/identity/clients.json:ro
    networks:
      edge_net:
        # edge_net is shared by every stack, and upstream names on it must be unique (infra/edge/README.md,
        # rule 4 in asafarim-platform). The site file proxies to this alias.
        aliases:
          - os-identity
      # The platform's Postgres, read-only (identity_ro), under the alias platform-postgres.
      identity_db:
      # This stack's private network: identity and its Redis only.
      os_net:

  os-redis:
    # Pinned to a minor line, not a floating tag. Identity's sessions and grants live here, so a
    # restart keeps them: append-only persistence on a named volume, and no eviction (a full Redis
    # must fail loudly, not silently drop someone's session).
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    volumes:
      - os_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # os_net ONLY. Redis never joins edge_net, and publishes no port.
    networks:
      - os_net

  os-site:
    # asafarim.site: static files behind unprivileged nginx (core/site/Dockerfile), published by
    # .github/workflows/site-image.yml. SITE_IMAGE_TAG is the full commit sha of that build; like
    # IMAGE_TAG it has no default.
    image: ghcr.io/alisafari-it/asafarim-os:site-${SITE_IMAGE_TAG:?set SITE_IMAGE_TAG to the site image's commit sha}
    restart: unless-stopped
    read_only: true
    # nginx's pid file and temp paths live in /tmp in the unprivileged image.
    tmpfs:
      - /tmp:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 32m
    cpus: 0.25
    environment:
      # The entrypoint's helper scripts try to edit /etc/nginx on start; on a read-only root they only
      # log that they can't, and nginx starts with the config baked into the image.
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    networks:
      edge_net:
        # Unique on the shared edge_net; sites/asafarim-os.caddy proxies asafarim.site to it.
        aliases:
          - os-site

  breinhap-site:
    # breinhap.asafarim.site: the Breinhap landing page, static files behind unprivileged nginx. It is built in its
    # own repository (AliSafari-IT/breinhap, apps/site) and published by that repository's "Site image" workflow
    # as ghcr.io/alisafari-it/breinhap:site-<full commit sha>. The sha is pinned HERE: to ship a new version of
    # the page, change it to the sha of the newest successful "Site image" run in breinhap, in a PR (the deploy
    # after that merge pulls it). Like os-site, it holds no secrets.
    image: ghcr.io/alisafari-it/breinhap:site-1d09fee765a6a3d1f4d33a03738d668296d5be5d
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 32m
    cpus: 0.25
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    networks:
      edge_net:
        # Unique on the shared edge_net; sites/asafarim-os.caddy proxies breinhap.asafarim.site to it.
        aliases:
          - breinhap-site

  igs-site:
    # igs.asafarim.site: the IGS-Pharma landing page, static files behind unprivileged nginx. It is built in its own
    # repository (AliSafari-IT/igs-pharma, apps/site) and published by that repository's "Landing page image" workflow
    # as ghcr.io/alisafari-it/igs-pharma-site:<full commit sha>. Pinned HERE like breinhap-site: to ship a new
    # version, change the sha in a PR. The storefront (igs-pharma.be) is a different stack (asafarim-platform).
    image: ghcr.io/alisafari-it/igs-pharma-site:6c136173db743b62b5634a92cbf7c0aeba227740
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 32m
    cpus: 0.25
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    networks:
      edge_net:
        # Unique on the shared edge_net; sites/asafarim-os.caddy proxies igs.asafarim.site to it.
        aliases:
          - igs-site

  os-docs:
    # docs.asafarim.site: the Docs app's Next.js server (apps/docs/Dockerfile), published by
    # .github/workflows/docs-image.yml. DOCS_IMAGE_TAG is the full commit sha of that build; like IMAGE_TAG it
    # has no default.
    image: ghcr.io/alisafari-it/asafarim-os:docs-${DOCS_IMAGE_TAG:?set DOCS_IMAGE_TAG to the docs image's commit sha}
    restart: unless-stopped
    read_only: true
    # uid/gid 1000 is the image's `node` user, the only writer.
    tmpfs:
      - /tmp:size=16m
      - /app/apps/docs/.next/cache:size=32m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The manifest's resources (apps/docs/platform.app.json).
    mem_limit: 256m
    cpus: 0.5
    # Decrypted from apps/docs/.env.production.age by deploy/vps-deploy.sh, at the repository root. Today it
    # holds AUTH_SECRET only (apps/docs/.env.production.example).
    env_file:
      - ../.env.docs
    environment:
      HOSTNAME: 0.0.0.0
      ASAFARIM_APP_ID: docs
      # Sign-in goes through this stack's identity, at its public URL.
      OIDC_ISSUER: https://id.asafarim.site
      # Permission checks and self-registration: this stack's core-api, on os_core. The app only uses it once
      # ASAFARIM_REGISTRY_CREDENTIAL (from `deploy/core-api/admin.sh install docs`) is in .env.docs as well;
      # without it the SDK treats docs as not installed and the gate answers 503.
      CORE_API_URL: http://os-core-api:4020
    networks:
      edge_net:
        # Unique on the shared edge_net; sites/asafarim-os.caddy proxies docs.asafarim.site to it.
        aliases:
          - os-docs
      # core-api and the app's own database (os-postgres). Not os_net: docs never reaches identity's Redis.
      os_core:

  # ---- core-api (the control plane) and its Postgres -----------------------------------------------------------
  # Started only when the deployed commit has core/core-api/.env.production.age: deploy/vps-deploy.sh then turns
  # the "core" profile on. Neither joins edge_net; nothing outside this host reaches them. The Admin console
  # (os-admin, below) has its own "admin" profile on top of this one.

  os-postgres:
    # The OS's OWN Postgres (never the platform's): the core database, and one database per installed app
    # (core-api's provisioner creates them). Major version 16: core-api's pg_dump is 16 too.
    image: postgres:16-alpine
    profiles: [core]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    # POSTGRES_PASSWORD (the superuser: core-api's provisioner) and CORE_API_DB_PASSWORD (core-api's own role),
    # decrypted from core/core-api/.env.production.age by deploy/vps-deploy.sh.
    env_file:
      - ../.env.core-api
    volumes:
      - os_pg_data:/var/lib/postgresql/data
      # First start only (an empty volume): the core_api role and the core database it owns.
      - ./core-api/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: on the first start the image's init runs a temporary server on the Unix socket only (while
      # 10-core.sh runs), then restarts. Only the real server answers on 127.0.0.1.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "core"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - os_core

  os-core-api:
    # Published by .github/workflows/core-api-image.yml. CORE_API_IMAGE_TAG is the full commit sha of that build;
    # deploy/vps-deploy.sh always sets it (no default, like the others).
    image: ghcr.io/alisafari-it/asafarim-os:core-api-${CORE_API_IMAGE_TAG:?set CORE_API_IMAGE_TAG to the core-api image's commit sha}
    profiles: [core]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      os-postgres:
        condition: service_healthy
    env_file:
      - ../.env.core-api
    environment:
      # The Admin console's people are verified against this stack's identity (when the console goes live).
      CORE_API_IDENTITY_ISSUER: https://id.asafarim.site
      # Where the launcher's Admin tile opens, for core.admin holders only (every app's app switcher).
      CORE_API_ADMIN_CONSOLE_URL: https://admin.asafarim.site/
      # An installed app's DATABASE_URL points at os-postgres, by its name on os_core.
      CORE_API_APP_DB_HOST: os-postgres
      CORE_API_APP_DB_PORT: "5432"
      # Health polling (P6.1): where each app runs, on os_core.
      OS_APP_DOCS_UPSTREAM: os-docs:3000
    volumes:
      # Remove's database backups (CORE_API_BACKUP_DIR in the image), kept across restarts.
      - os_core_api_backups:/var/lib/core-api/backups
    # The admin API for the owner on the VPS itself (deploy/core-api/admin.sh): loopback only, never public.
    ports:
      - "127.0.0.1:4020:4020"
    networks:
      os_core:
        aliases:
          - os-core-api

  os-admin:
    # admin.asafarim.site: the Admin console's Next.js server (core/admin/Dockerfile, asafarim-os#175), published by
    # .github/workflows/admin-image.yml. ADMIN_IMAGE_TAG is the full commit sha of that build; deploy/vps-deploy.sh
    # always sets it. Its own "admin" profile, which deploy/vps-deploy.sh turns on (next to "core") once
    # core/admin/.env.production.age is committed: without it the env_file below would not exist.
    image: ghcr.io/alisafari-it/asafarim-os:admin-${ADMIN_IMAGE_TAG:?set ADMIN_IMAGE_TAG to the admin image's commit sha}
    profiles: [admin]
    restart: unless-stopped
    read_only: true
    # uid/gid 1000 is the image's `node` user, the only writer.
    tmpfs:
      - /tmp:size=16m
      - /app/core/admin/.next/cache:size=32m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    # Decrypted from core/admin/.env.production.age by deploy/vps-deploy.sh, at the repository root: AUTH_SECRET and
    # OIDC_CLIENT_SECRET (core/admin/.env.production.example).
    env_file:
      - ../.env.admin
    environment:
      HOSTNAME: 0.0.0.0
      # Sign-in goes through this stack's identity, at its public URL.
      OIDC_ISSUER: https://id.asafarim.site
      # Every page and action calls core-api's admin API as the signed-in administrator (ID token as Bearer).
      CORE_API_URL: http://os-core-api:4020
    depends_on:
      - os-core-api
    networks:
      edge_net:
        # Unique on the shared edge_net; sites/asafarim-os.caddy proxies admin.asafarim.site to it.
        aliases:
          - os-admin
      # core-api, by its name on os_core. Not os_net: the console never reaches identity's Redis.
      os_core:

networks:
  # The shared edge's network, created with the edge. identity joins it to be reachable by the edge's Caddy.
  edge_net:
    external: true
    name: edge_net
  # The private link to the platform's Postgres. Created by asafarim-platform's vps-deploy.sh
  # (ensure_identity_db_net); only that stack's postgres and this stack's identity join it.
  identity_db:
    external: true
    name: identity_db
  os_net:
  # core-api, its Postgres, the Admin console and the apps it serves (os-docs). identity and os-redis are not on it.
  os_core:

volumes:
  os_redis_data:
  os_pg_data:
  os_core_api_backups:

# The production event bus (asafarim-os#259, ADR 0001 §5): the same design as the dev bus (scripts/dev/nats/nats.conf).
# It runs in deploy/compose.prod.yml as os-nats, on os_core only, with no published port.
#
# Every client but `core` is sent to core-api (NATS auth callout): an app connects with user = its app id and
# password = a signed assertion made with its registry credential, and gets exactly the permissions its current
# manifest allows. ANONYMOUS CONNECTS ARE REFUSED: there is no `no_auth_user`, no `token` and no other user here, and
# deploy/compose.prod.test.mjs fails if one is added.
#
# `core` is core-api's own privileged user (stream and consumer admin, and the callout responder). The two values
# come from the environment (core/nats/.env.production.example, decrypted to .env.nats by deploy/vps-deploy.sh), so
# no secret is in this file. NATS refuses to start when either is unset.
#
# No TLS: the bus is reachable only on os_core, inside this host (compose.prod.yml says why, and README.md lists who
# is on that network).
max_connections: 64

accounts {
  OS {
    jetstream: enabled
    users: [ { user: core, password: $NATS_CORE_PASSWORD } ]
  }
}

authorization {
  auth_callout {
    issuer: $NATS_AUTH_ISSUER
    account: OS
    auth_users: [ core ]
  }
}
